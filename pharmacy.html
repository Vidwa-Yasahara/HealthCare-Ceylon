<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="pharmacy.css">

<body>
    <header>
        <nav class="nav-bar">
            <div class="website-logo">
                <img src="website-logo-2.png" alt="website-logo">
                <h1>HealthCare Ceylon</h1>
            </div>
            <div class="nav1">
                <div class="Hotline"><p>Emergencies - Call (019)</p></div>

                <button class="button1">Contact us</button>
                <button class="button1">Email</button>
                <button class="button1">Our socials</button>

                <form class="search-bar" action="/search" method="get">
                    <input type="text" placeholder="Search here">
                    <button type="submit">Search</button>
                </form>
                <div class="profile-pic">
                    <img src="profile-pic.jpg" alt="Profile">
                </div>
            </div>
        </nav>
  
        <nav class="navigations">
            <a href="index.html" class="nav_link">Home</a>
            <a href="about-us.html" class="nav_link">About us</a>
            <a href="services.html" class="nav_link">Services</a>
            <a href="doctors.html" class="nav_link">Doctors</a>
            <a href="reservation.html" class="nav_link">Reservations</a>
            <a href="pharmacy.html" class="nav_link">Pharmacy</a>
            <a href="patient-registration.html" class="nav_link">Patient Registration</a>
        </nav>
 
    </header>
    <main>
        <section id="medicine-section">
            <h1>Medicine Order Page</h1>
            <!-- Medicines will be dynamically loaded here by JavaScript -->
        </section>

        <section id="cart-section">
            <h2>Your Cart</h2>
            <table id="cart-table">
                <thead>
                    <tr>
                        <th>Medicine</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                        <th>Actions</th> <!-- New column for Delete button -->
                    </tr>
                </thead>
                <tbody>
                    <!-- Cart items will be added here by JavaScript -->
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="5">Total</td>
                        <td id="grand-total">$0.00</td>
                    </tr>
                </tfoot>
            </table>
            <div class="cart-actions">
                <button id="add-to-favorites">Add to Favorites</button>
                <button id="apply-favorites">Apply Favorites</button>
                <button id="clear-cart">Clear Cart</button>
            <a href="purchase.html">
                <button id="purchase">Purchase</button>
            </a>
            </div>
        </section>
    </main>

<footer>
